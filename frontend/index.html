<style>
  /* KBC-aligned design tokens. Brand blue is an accent only: on white it is 2.5:1, so text and
     buttons use KBC navy (12.2:1 on white) and an accessible blue (#00709C, 5.5:1). */
  :root {
    --kbc-blue: #00AEEF; --kbc-blue-text: #00709C; --kbc-blue-soft: #E6F7FD;
    --kbc-navy: #003665; --kbc-navy-hover: #002A50;
    --ink: #0F1B2D; --muted: #475569; --line: #E2E8F0; --surface: #F4F7FA; --card: #FFFFFF;
    --care-bg: #FFF4E0; --care-ink: #8A4B00;
    --radius-card: 20px; --radius-ctl: 12px;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
         color: var(--ink); background: var(--surface); font-size: 16px; line-height: 1.5; }
  .kbc-text { color: var(--kbc-blue-text); }
  .kbc-bg { background: var(--kbc-navy); }
  .kbc-border { border-color: var(--kbc-navy); }
  .brand-bar { background: var(--kbc-navy); color: #fff; }
  .brand-mark { background: var(--kbc-blue); color: var(--kbc-navy); }
  /* controls: 44px targets, visible focus, 200ms feedback */
  .btn { min-height: 44px; padding: 0 16px; border-radius: var(--radius-ctl); font-weight: 600; font-size: 15px;
         display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
         transition: background-color .2s ease, border-color .2s ease, transform .1s ease; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--kbc-navy); color: #fff; }
  .btn-primary:hover { background: var(--kbc-navy-hover); }
  .btn-secondary { background: #fff; color: var(--kbc-navy); border: 1px solid #CBD5E1; }
  .btn-secondary:hover { background: var(--kbc-blue-soft); border-color: var(--kbc-blue); }
  .btn-quiet { min-height: 36px; padding: 0 10px; font-size: 13px; font-weight: 500; color: var(--muted); background: transparent; border-radius: 10px; }
  .btn-quiet:hover { background: #EEF2F6; color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid var(--kbc-blue); outline-offset: 2px; border-radius: 10px; }
  .field { min-height: 44px; border: 1px solid #CBD5E1; border-radius: var(--radius-ctl); padding: 0 12px; background: #fff; }
  .field:focus { border-color: var(--kbc-blue); }
  /* phone frame */
  .phone { width: 390px; height: 820px; border-radius: 48px; border: 10px solid #0B1220; background: var(--surface);
           overflow: hidden; box-shadow: 0 30px 60px rgba(0, 54, 101, .22); display: flex; flex-direction: column; }
  .phone-notch { height: 30px; background: #0B1220; flex: none; }
  .phone-body { flex: 1; overflow-y: auto; }
  .tabbar { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(255,255,255,.96);
            border-top: 1px solid var(--line); padding: 6px 8px 14px; }
  .tabbar .tab { min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
                 font-size: 12px; font-weight: 500; color: var(--muted); border-radius: 12px; cursor: pointer; }
  .tabbar .tab[aria-current="page"] { color: var(--kbc-navy); font-weight: 700; }
  .tabbar .tab[aria-current="page"] svg { color: var(--kbc-blue-text); }
  /* cards and chips */
  .card { background: var(--card); border-radius: 16px; border: 1px solid #E3E8EF; box-shadow: 0 1px 2px rgba(15, 27, 45, .05); }
  .moment { position: relative; }
  .chip { display: inline-flex; align-items: center; font-size: 13px; font-weight: 600; line-height: 1.4; white-space: nowrap; color: var(--muted); }
  .chip + .chip::before { content: "·"; margin: 0 .45rem; color: #94A3B8; font-weight: 400; }
  .chip-cal, .chip-world { color: var(--kbc-navy); }
  .chip-neutral { color: var(--muted); font-weight: 500; }
  .chip-care { color: var(--care-ink); }
  .care-banner { background: #FFF8EC; color: var(--care-ink); border: 1px solid #F3DDB5; border-radius: 16px; }
  .fade { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } .btn { transition: none; } .btn:active { transform: none; } }
  table td, table th { padding: .4rem .5rem; text-align: left; }
  table tr + tr td { border-top: 1px solid var(--line); }
  .tile-num { font-variant-numeric: tabular-nums; }
  .lang-btn { min-width: 44px; min-height: 36px; border-radius: 9px; font-weight: 700; font-size: 13px; color: #CFEFFC; cursor: pointer; }
  .lang-btn[aria-pressed="true"] { background: #fff; color: var(--kbc-navy); }
</style>
</head>

<header class="brand-bar">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl brand-mark flex items-center justify-center font-extrabold text-lg" aria-hidden="true">K</div>
      <div>
        <div class="font-semibold leading-tight">Kate Foresight</div>
        <div class="text-xs text-sky-100" data-i18n="tagline"></div>
      </div>
    </div>
    <div class="flex items-center gap-3 text-sm">
      <div id="lang-switch" class="flex rounded-xl bg-white/10 p-1" role="group" aria-label="Language / Taal / Langue">
        <button data-lang="nl" class="lang-btn">NL</button>
        <button data-lang="en" class="lang-btn">EN</button>

</header>

    </div>
  </section>

        <h2 class="font-semibold mt-4 mb-2">Opt-outs and consents</h2><table class="w-full text-sm" id="admin-optouts"></table></div>

    <div class="card p-5">

      <div class="overflow-x-auto"><table class="w-full text-xs" id="admin-log"></table></div>
    </div>
  </section>
</main>

  function loadLang() { try { const v = localStorage.getItem("kate_lang"); return ["nl", "en", "fr"].includes(v) ? v : "nl"; } catch (_) { return "nl"; } }
  function t(key, ...args) { const v = (I18N[state.lang] || I18N.nl)[key] ?? I18N.en[key] ?? key; return typeof v === "function" ? v(...args) : v; }
  function applyI18n() {
    document.documentElement.lang = state.lang;
    document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
    document.querySelectorAll(".lang-btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  }
  function setLang(lang) {
    state.lang = lang;
    try { localStorage.setItem("kate_lang", lang); } catch (_) {}
    applyI18n();
    renderPersonas();
    if (!$("view-customer").classList.contains("hidden")) setTab(state.tab);
  }


  const PERSONAS = [
    { id: "lien", name: "Lien", sub: "29 · Leuven", blurb: { nl: "Huurt al 4 jaar, €26k gespaard, vakantiegeld in mei, Bolero-ETF's.", en: "Renting 4 years, €26k saved, holiday pay in May, Bolero ETFs.", fr: "Locataire depuis 4 ans, €26k d'épargne, pécule de vacances en mai, ETF Bolero." } },
    { id: "marc", name: "Marc", sub: "47 · Brussel · KBC Brussels", blurb: { nl: "Diesel-bedrijfswagen, woningverzekering +8% binnen 6 weken, Chloé wordt 18.", en: "Diesel company car, home insurance +8% in 6 weeks, Chloé turns 18.", fr: "Voiture de société diesel, assurance habitation +8 % dans 6 semaines, Chloé a 18 ans." } },
    { id: "rita", name: "Rita", sub: "71 · Kortrijk", blurb: { nl: "Pensioen, €48k spaargeld, verdachte betaling tegengehouden. Een adviseur belt haar.", en: "Pension, €48k on savings, a suspicious payment held. An advisor calls her.", fr: "Pension, €48k d'épargne, paiement suspect retenu. Un conseiller l'appelle." } },
    { id: "admin", name: "Control room", sub: "KBC · admin", blurb: { nl: "Momenten over 203 klanten, kanaalmix, zorgmodus, beslissingslog.", en: "Moments across 203 customers, channel mix, care mode, decision log.", fr: "Moments sur 203 clients, mix de canaux, mode protection, journal." } },
  ];
  const CHANNEL_LABEL = new Proxy({}, { get: (_, k) => (typeof k === "string" ? t("ch_" + k) : undefined) });
  const SOURCE_LABEL = new Proxy({}, { get: (_, k) => (typeof k === "string" ? t("src_" + k) : undefined) });
  const STAKES_STYLE = { low: "bg-slate-100 text-slate-600", medium: "bg-sky-100 text-sky-800", high: "bg-amber-100 text-amber-800" };

  const $ = (id) => document.getElementById(id);
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function fmtEur(n) { return "€" + Math.round(Number(n)).toLocaleString("en-BE"); }

  async function api(path, options = {}) {
    const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
    if (state.token) headers["Authorization"] = "Bearer " + state.token;
    const res = await fetch(API_BASE + path, { ...options, headers });
    if (res.status === 401 && state.token) { logout(); throw new Error("Session expired"); }
    if (!res.ok) {
      let detail = res.statusText;
      try { const body = await res.json(); detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail); } catch (_) {}
      throw new Error(detail);
    }
    return res;
  }

  // ---------------------------------------------------------------- login
  function renderPersonas() {
    const box = $("personas");
    clear(box);
    PERSONAS.forEach((p) => {
      const card = el("button", "card text-left p-5 cursor-pointer transition hover:border-sky-400");
      card.type = "button";
      const av = el("div", "w-12 h-12 rounded-full brand-mark flex items-center justify-center font-bold text-lg mb-3", p.name.slice(0, 1));
      av.setAttribute("aria-hidden", "true");
      card.appendChild(av);
      card.appendChild(el("div", "font-bold text-lg", p.name));
      card.appendChild(el("div", "text-xs kbc-text font-medium", p.sub));
      card.appendChild(el("p", "text-sm text-slate-600 mt-2", p.blurb[state.lang] || p.blurb.en));
      card.addEventListener("click", () => { $("login-id").value = p.id; $("login-pw").focus(); });
      box.appendChild(card);
    });
  }

  $("login-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    $("login-error").textContent = "";
    try {
      const res = await api("/login", { method: "POST", body: JSON.stringify({ customer_id: $("login-id").value.trim(), password: $("login-pw").value }) });
      const body = await res.json();
      state.token = body.access_token; state.role = body.role; state.profile = body.profile;
      $("login-pw").value = "";
      show(state.role === "admin" ? "admin" : "customer");
    } catch (err) {
      $("login-error").textContent = err.message === "Invalid credentials" ? t("invalid") : t("login_fail") + err.message;
    }
  });

  function logout() {
    state.token = null; state.role = null; state.profile = null; state.feed = null; state.timeline = null;
    show("login");
  }
  $("logout").addEventListener("click", logout);

  function show(view) {
    ["login", "customer", "admin"].forEach((v) => $("view-" + v).classList.toggle("hidden", v !== view));
    $("logout").classList.toggle("hidden", view === "login");
    $("who").textContent = view === "login" ? "" : (state.profile && state.profile.name) || "";
    if (view === "customer") { state.tab = "feed"; setTab("feed"); }
    if (view === "admin") loadAdmin();
  }

  // ------------------------------------------------------------- customer
  document.querySelectorAll(".tab").forEach((btn) => btn.addEventListener("click", () => setTab(btn.dataset.tab)));
  function setTab(tab) {
    state.tab = tab;
    document.querySelectorAll(".tab").forEach((b) => {
      const active = b.dataset.tab === tab;
      if (active) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    $("greeting").textContent = state.profile ? greet(state.profile) : "";
    $("greeting-sub").textContent = state.profile ? `${cap(state.profile.region)} · ${t("comfort")} ${state.profile.digital_comfort}/5` : "";
    hideWhy();
    if (tab === "feed") loadFeed();
    if (tab === "timeline") loadTimeline();
    if (tab === "consents") loadConsents();
  }
  function cap(t) { return t ? t.charAt(0).toUpperCase() + t.slice(1) : ""; }
  function greet(p) {
    const name = p.first_name || p.name;
    return `${t("greet")} ${name}`;
  }
  function loading(text) { const body = $("phone-body"); clear(body); body.appendChild(el("p", "text-sm text-slate-600 py-6 text-center", text || t("loading"))); }
  function errorBox(err) { const body = $("phone-body"); clear(body); body.appendChild(el("p", "text-sm text-red-600", t("load_error") + err.message)); }

  async function loadFeed() {
    loading();
    try {
      const data = await (await api("/me/moments?lang=" + state.lang)).json();
      state.feed = data;
      renderFeed(data);
    } catch (err) { errorBox(err); }
  }

  function renderFeed(data) {
    const body = $("phone-body");
    clear(body);
    if (data.care_mode) {
      const banner = el("div", "care-banner p-4 text-sm");
      banner.setAttribute("role", "status");
      banner.appendChild(el("div", "font-semibold", t("care_title")));
      banner.appendChild(el("div", "", t("care_text")));
      body.appendChild(banner);
    }
    const head = el("div", "flex items-center justify-between text-xs text-slate-600 px-1");
    head.appendChild(el("span", "", `${t("moments", data.moments.length)} · ${data.today}`));
    head.appendChild(el("span", "", `${t("narration")}: ${data.narration}`));
    body.appendChild(head);
    if (!data.moments.length) body.appendChild(el("p", "text-sm text-slate-600 py-8 text-center", t("empty")));
    data.moments.forEach((m) => body.appendChild(momentCard(m)));
  }

  function chip(text, cls) { return el("span", "chip " + cls, text); }

  const SOURCE_CHIP = { life_calendar: "chip-cal", world_rule: "chip-world", protection: "chip-care" };
  const SOURCE_ACCENT = { life_calendar: "var(--kbc-blue)", world_rule: "var(--kbc-navy)", protection: "#E08A00" };
  const ICON_SPEAKER = '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>';
  function svgIcon(paths) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    ["width", "height"].forEach((a) => svg.setAttribute(a, "20"));
    svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("fill", "none"); svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "2"); svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    // static, trusted markup defined in this file (never data from the API)
    const tpl = new DOMParser().parseFromString(`<svg xmlns="${ns}">${paths}</svg>`, "image/svg+xml");
    Array.from(tpl.documentElement.childNodes).forEach((n) => svg.appendChild(document.importNode(n, true)));
    return svg;
  }

  function momentCard(m) {
    const card = el("article", "card moment p-5 pl-6 fade");
    card.style.setProperty("--accent", SOURCE_ACCENT[m.source] || "var(--kbc-blue)");
    const top = el("div", "flex flex-wrap gap-1.5 mb-3");
    top.appendChild(chip(SOURCE_LABEL[m.source] || m.source, SOURCE_CHIP[m.source] || "chip-cal"));
    top.appendChild(chip(CHANNEL_LABEL[m.channel] || m.channel, "chip-neutral"));
    if (m.stakes === "high") top.appendChild(chip(t("high_stakes"), "chip-care"));
    if (m.delivery === "queued") top.appendChild(chip(t("later"), "chip-neutral"));
    card.appendChild(top);
    card.appendChild(el("p", "text-[16px] leading-relaxed", m.message));
    const conf = el("p", "mt-2 text-xs text-slate-600", t("confident", Math.round(m.confidence * 100)) + (m.human_review ? t("reviewed") : ""));
    card.appendChild(conf);

    const actions = el("div", "mt-4 grid grid-cols-2 gap-2");
    const cta = el("button", "btn btn-primary col-span-2", m.cta_label);
    cta.addEventListener("click", () => toast(card, m.channel === "advisor" ? t("toast_advisor") : t("toast_kate")));
    actions.appendChild(cta);
    const why = el("button", "btn btn-secondary", t("why"));
    why.setAttribute("aria-label", t("why_title"));
    why.addEventListener("click", () => showWhy(m));
    actions.appendChild(why);
    const voice = el("button", "btn btn-secondary");
    voice.appendChild(svgIcon(ICON_SPEAKER));
    voice.appendChild(el("span", "", t("listen")));
    voice.setAttribute("aria-label", t("listen"));
    voice.addEventListener("click", () => playVoice(m, card, voice));
    actions.appendChild(voice);
    card.appendChild(actions);

    const fb = el("div", "mt-3 pt-2 border-t border-slate-100 flex flex-wrap gap-1");
    fb.setAttribute("role", "group"); fb.setAttribute("aria-label", t("fb_group"));
    ["not_now", "not_relevant", "never", "helpful"].forEach((action) => {
      const b = el("button", "btn btn-quiet", t("fb_" + action));
      b.addEventListener("click", () => sendFeedback(m.type, action));
      fb.appendChild(b);
    });
    card.appendChild(fb);
    return card;
  }

  function toast(card, text) {
    const note = el("div", "mt-3 text-sm rounded-xl px-3 py-2 fade", text);
    note.style.background = "var(--kbc-blue-soft)"; note.style.color = "var(--kbc-navy)";
    note.setAttribute("role", "status");
    card.appendChild(note);
    setTimeout(() => note.remove(), 3500);
  }

  async function sendFeedback(type, action) {
    try {
      await api("/me/feedback", { method: "POST", body: JSON.stringify({ moment_type: type, action }) });
      await loadFeed();
    } catch (err) { alert(t("feedback_fail") + err.message); }
  }

  async function playVoice(m, card, button) {
    button.disabled = true;
    try {
      const res = await fetch(API_BASE + "/me/voice/" + encodeURIComponent(m.type) + "?lang=" + state.lang, { headers: { Authorization: "Bearer " + state.token } });
      if (!res.ok) { toast(card, res.status === 404 ? t("voice_off") : t("voice_fail") + " (" + res.status + ")"); return; }
      const blob = await res.blob();
      const audio = new Audio(URL.createObjectURL(blob));
      audio.play();
    } catch (err) { toast(card, t("voice_fail") + ": " + err.message); }
    finally { button.disabled = false; }
  }

  function showWhy(m) {
    $("side-hint").classList.add("hidden");
    const drawer = $("why-drawer");
    drawer.classList.remove("hidden");
    $("why-text").textContent = m.why;
    const ul = $("why-evidence"); clear(ul);
    m.evidence.forEach((e) => ul.appendChild(el("li", "", e)));
    const dl = $("why-meta"); clear(dl);
    [[t("m_rule"), m.type], [t("m_source"), SOURCE_LABEL[m.source] || m.source], [t("m_conf"), Math.round(m.confidence * 100) + "%"],
     [t("m_stakes"), t("stakes_" + m.stakes)], [t("m_window"), `${m.window[0]} → ${m.window[1]}`], [t("m_channel"), CHANNEL_LABEL[m.channel] || m.channel],
     [t("m_legal"), m.legal_basis], [t("m_human"), m.human_review ? t("yes") : t("no")], [t("m_score"), m.score],
     [t("m_actions"), m.actions.join(", ")]].forEach(([k, v]) => {
      dl.appendChild(el("dt", "text-slate-600", k)); dl.appendChild(el("dd", "font-medium break-words", v));
    });
  }
  function hideWhy() { $("why-drawer").classList.add("hidden"); $("side-hint").classList.remove("hidden"); }
  $("why-close").addEventListener("click", hideWhy);

  async function loadTimeline() {
    loading();
    try {
      const data = await (await api("/me/timeline?lang=" + state.lang)).json();
      const body = $("phone-body"); clear(body);
      body.appendChild(el("div", "text-xs text-slate-600 px-1", t("tl_from", data.today, data.entries.length)));
      let lastMonth = "";
      data.entries.forEach((e) => {
        const month = e.start.slice(0, 7);
        if (month !== lastMonth) { body.appendChild(el("h3", "text-xs font-bold uppercase tracking-wider text-slate-600 pt-3 px-1", monthLabel(month))); lastMonth = month; }
        const row = el("div", "card moment p-4 pl-5 fade");
        row.style.setProperty("--accent", SOURCE_ACCENT[e.source] || "var(--kbc-blue)");
        const head = el("div", "flex items-center justify-between gap-2");
        head.appendChild(el("span", "text-sm font-semibold kbc-text", e.start));
        const chips = el("span", "flex gap-1");
        chips.appendChild(chip(SOURCE_LABEL[e.source] || e.source, SOURCE_CHIP[e.source] || "chip-cal"));
        head.appendChild(chips);
        row.appendChild(head);
        row.appendChild(el("p", "text-[15px] mt-1 leading-snug", e.title));
        const why = el("button", "btn btn-quiet -ml-2 mt-1", t("why"));
        why.addEventListener("click", () => showWhy({ ...e, why: e.title, confidence: 1, window: [e.start, e.end], legal_basis: "see rule", human_review: false, score: "-", actions: [] }));
        row.appendChild(why);
        body.appendChild(row);
      });
    } catch (err) { errorBox(err); }
  }
  function monthLabel(ym) {
    const [y, m] = ym.split("-");
    return new Date(Number(y), Number(m) - 1, 1).toLocaleString(t("locale"), { month: "long", year: "numeric" });
  }

  async function loadConsents() {
    loading();
    try {
      const consents = await (await api("/me/consents")).json();
      const body = $("phone-body"); clear(body);
      body.appendChild(el("h2", "text-lg font-bold px-1", t("c_title")));
      body.appendChild(el("p", "text-sm text-slate-600 px-1", t("c_sub")));
      const rows = [
        ["use_insurance_data", t("c_ins"), t("c_ins_h")],
        ["use_other_banks", t("c_banks"), t("c_banks_h")],
        ["marketing", t("c_mkt"), t("c_mkt_h")],
      ];
      rows.forEach(([key, label, help]) => {
        const row = el("label", "card flex items-start gap-3 p-4 cursor-pointer");
        const input = document.createElement("input");
        input.type = "checkbox"; input.checked = Boolean(consents[key]); input.className = "mt-1 w-5 h-5"; input.style.accentColor = "var(--kbc-navy)";
        input.addEventListener("change", async () => {
          consents[key] = input.checked;
          try { await api("/me/consents", { method: "PUT", body: JSON.stringify(consents) }); }
          catch (err) { alert(t("save_fail") + err.message); input.checked = !input.checked; consents[key] = input.checked; }
        });
        row.appendChild(input);
        const text = el("div", "");
        text.appendChild(el("div", "text-sm font-medium", label));
        text.appendChild(el("div", "text-sm text-slate-600", help));
        row.appendChild(text);
        body.appendChild(row);
      });
      const note = el("p", "text-sm text-slate-600 mt-2 px-1", t("c_note"));
      body.appendChild(note);
    } catch (err) { errorBox(err); }
  }

  // ---------------------------------------------------------------- admin
  const EXAMPLE_RULE = {
    id: "savings_exemption_2027",
    title: { en: "Savings-account interest exemption replaced by a €6,000 investment-income exemption" },
    summary: { en: "From 1 January 2027 the savings-account exemption is replaced by a €6,000 investment-income exemption. Your savings of €{savings_balance} are affected.",
               nl: "Vanaf 1 januari 2027 vervangt een vrijstelling van €6.000 op beleggingsinkomsten de spaarvrijstelling. Je spaargeld van €{savings_balance} valt eronder.",
               fr: "Dès le 1er janvier 2027, une exonération de €6.000 sur les revenus d'investissement remplace l'exonération de l'épargne. Votre épargne de €{savings_balance} est concernée." },
    cta: { en: "Explain it to me", nl: "Leg het me uit", fr: "Expliquez-moi" },
    effective_date: "2027-01-01",
    level: "federal",
    conditions: [{ field: "savings_balance", op: "gt", value: 20000 }],
    impact: { kind: "none", direction: "neutral" },
    evidence: ["savings balance €{savings_balance} above €20,000", "budget agreement (illustrative headline for the demo)"],
    actions: ["explain_change", "talk_to_advisor"],
    stakes: "medium"
  };

  $("admin-refresh").addEventListener("click", loadAdmin);
  $("rule-submit").addEventListener("click", async () => {
    const out = $("rule-result"); out.textContent = "Running…";
    try {
      const parsed = JSON.parse($("rule-json").value);
      const res = await (await api("/admin/rules", { method: "POST", body: JSON.stringify(parsed) })).json();
      out.textContent = `Affected ${res.affected_customers} of ${res.customers_total} customers (impact ${fmtEur(res.total_impact)}). Sample: ${res.sample_customer_ids.join(", ")}`;
      loadAdmin();
    } catch (err) { out.textContent = "Rejected: " + err.message; }
  });

  async function loadAdmin() {
    if (!$("rule-json").value) $("rule-json").value = JSON.stringify(EXAMPLE_RULE, null, 2);
    try {
      const d = await (await api("/admin/overview")).json();
      $("admin-sub").textContent = `${d.today} · ${d.customers_total} customers · narration: ${d.narration}`;
      const tiles = $("admin-tiles"); clear(tiles);
      [["Customers", d.customers_total], ["With a moment today", d.customers_with_moments], ["Moments", d.moments_total],
       ["Human handoffs", d.human_handoffs], ["Care mode", d.care_mode_count], ["Pushed now", (d.moments_by_delivery || {}).now || 0]]
        .forEach(([k, v]) => {
          const t = el("div", "card p-4");
          t.appendChild(el("div", "text-3xl font-bold tile-num", v)); t.lastChild.style.color = "var(--kbc-navy)"; t.appendChild(el("div", "text-xs text-slate-600", k)); tiles.appendChild(t);
        });
      fillTable($("admin-by-type"), Object.entries(d.moments_by_type));
      fillTable($("admin-by-channel"), Object.entries(d.moments_by_channel).map(([k, v]) => [CHANNEL_LABEL[k] || k, v]));
      fillTable($("admin-by-source"), Object.entries(d.moments_by_source).map(([k, v]) => [SOURCE_LABEL[k] || k, v]));
      fillTable($("admin-optouts"), [["'Never' feedback", d.opt_outs.never_feedback], ["Marketing off", d.opt_outs.marketing_off],
        ["Insurance data off", d.opt_outs.insurance_data_off], ["Other banks on", d.opt_outs.other_banks_on]]);
      const world = $("admin-world"); clear(world);
      const th = el("tr", "text-left text-slate-600"); ["Rule", "Since", "Affected", "€ impact"].forEach((h) => th.appendChild(el("th", "", h))); world.appendChild(th);
      d.world_rules.forEach((r) => {
        const tr = el("tr", "border-t border-slate-100");
        tr.appendChild(el("td", "", r.title)); tr.appendChild(el("td", "text-slate-600", r.effective_date));
        tr.appendChild(el("td", "font-medium", r.affected)); tr.appendChild(el("td", "", fmtEur(r.total_impact)));
        world.appendChild(tr);
      });
      const log = $("admin-log"); clear(log);
      const lh = el("tr", "text-left text-slate-600"); ["time", "customer", "moment", "decision", "reason", "score", "channel", "delivery"].forEach((h) => lh.appendChild(el("th", "", h))); log.appendChild(lh);
      d.decision_log_tail.slice().reverse().forEach((e) => {
        const tr = el("tr", "border-t border-slate-100");
        [e.ts, e.customer_id, e.moment_type, e.decision, e.reason, e.score, e.channel, e.delivery].forEach((v) => tr.appendChild(el("td", "whitespace-nowrap", v === null || v === undefined ? "" : v)));
        log.appendChild(tr);
      });
    } catch (err) { $("admin-sub").textContent = "Could not load overview: " + err.message; }
  }
  function fillTable(table, rows) {
    clear(table);
    rows.forEach(([k, v]) => { const tr = el("tr", "border-t border-slate-100"); tr.appendChild(el("td", "", k)); tr.appendChild(el("td", "text-right font-medium", v)); table.appendChild(tr); });
  }

  document.querySelectorAll(".lang-btn").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
  state.lang = loadLang();
  applyI18n();
  renderPersonas();
})();
</script>
</body>
</html>
